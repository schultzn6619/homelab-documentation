services:
  couchdb:
    image: couchdb:3.5.3-patched   # Arcane/Copa OS-package patch of couchdb:3.5.3
    pull_policy: never
    container_name: couchdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://localhost:5984/_up >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    user: "1000:1000"
    env_file: .env
    environment:
      - TZ=America/New_York
    networks:
      proxy:
    volumes:
      - ./couchdb-data:/opt/couchdb/data
      - ./couchdb-etc:/opt/couchdb/etc/local.d
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Headless LiveSync client: keeps a plain-Markdown copy of the vault in ./vault
  livesync-cli:
    # Pinned; update by hand after checking a release. 1.0.44 (2026-11-01) refused to
    # start the daemon on state written by earlier versions ("[Legacy state] ... owner
    # is unknown") and its fetch --force failed at random; 1.0.47 fixed the fetch
    # failures (#1329). Back up cli-db/ and vault/ before every update.
    image: ghcr.io/vrtmrz/livesync-cli:1.0.52-cli
    container_name: livesync-cli
    restart: unless-stopped
    # Healthy if the daemon has talked to CouchDB (port 5984) in about the last minute:
    # an ESTABLISHED or TIME_WAIT (lasts 60s) socket. It syncs roughly once a minute,
    # so three misses in a row (~3 min of silence) means it has stalled.
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require(\"fs\");const n=[\"/proc/net/tcp\",\"/proc/net/tcp6\"].flatMap(p=>{try{return fs.readFileSync(p,\"utf8\").trim().split(\"\\n\").slice(1)}catch(e){return []}}).map(r=>r.trim().split(/\\s+/)).filter(f=>parseInt(f[2].split(\":\").pop(),16)===5984&&[\"01\",\"06\"].includes(f[3])).length;process.exit(n>0?0:1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    user: "1000:1000"
    command: ["--vault", "/vault", "daemon"]
    environment:
      - TZ=America/New_York
    networks:
      proxy:
    volumes:
      - ./cli-db:/data
      - ./vault:/vault
    depends_on:
      - couchdb
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  proxy:
    external: true
