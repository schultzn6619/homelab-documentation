services:
  couchdb:
    image: couchdb:3.5.3
    container_name: couchdb
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      - TZ=America/New_York
    networks:
      proxy:
    volumes:
      - ./couchdb-data:/opt/couchdb/data
      - ./couchdb-etc:/opt/couchdb/etc/local.d
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Headless LiveSync client: keeps a plain-Markdown copy of the vault in ./vault
  livesync-cli:
    # Pinned: 1.0.44 (2026-11-01) refuses to start the daemon on state written by
    # earlier versions ("[Legacy state] ... owner is unknown"), and its fetch --force
    # fails at random. Update by hand after checking a release.
    image: ghcr.io/vrtmrz/livesync-cli:1.0.43-cli
    container_name: livesync-cli
    restart: unless-stopped
    user: "1000:1000"
    command: ["--vault", "/vault", "daemon"]
    environment:
      - TZ=America/New_York
    networks:
      proxy:
    volumes:
      - ./cli-db:/data
      - ./vault:/vault
    depends_on:
      - couchdb
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  proxy:
    external: true
