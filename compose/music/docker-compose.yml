# Self-hosted Spotify replacement: player (Navidrome) + downloader (slskd/Soulseek)
# Data lives under /mnt/storage/music; secrets in .env (not committed).
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - proxy
    environment:
      - ND_SCANSCHEDULE=@every 15m
      - ND_LOGLEVEL=info
      - ND_ENABLESHARING=false
      - ND_LISTENBRAINZ_ENABLED=true
    volumes:
      - /mnt/storage/music/navidrome:/data
      - /mnt/storage/music/library:/music:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  slskd:
    image: slskd/slskd:0.26.2
    container_name: slskd
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - proxy
    ports:
      - "50300:50300"          # Soulseek peer port (only matters if forwarded on the router)
      - "127.0.0.1:5030:5030"  # slskd API for the discover-weekly job (host only)
    env_file:
      - .env
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_DOWNLOADS_DIR=/music/soulseek
      - SLSKD_INCOMPLETE_DIR=/incomplete
      - SLSKD_SLSK_LISTEN_PORT=50300
    volumes:
      - /mnt/storage/music/slskd:/app
      - /mnt/storage/music/library:/music
      - /mnt/storage/music/incomplete:/incomplete
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  proxy:
    external: true
