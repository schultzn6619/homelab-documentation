# Home Assistant (Container install). Host networking so it can discover devices
# on the LAN (mDNS, SSDP). Reached through Nginx Proxy Manager at ha.<domain>;
# UFW only lets the Docker networks (NPM) reach port 8123.
services:
  homeassistant:
    image: homeassistant/home-assistant:2026.11.3-patched   # Arcane/Copa OS-package patch of homeassistant/home-assistant:2026.11.3
    pull_policy: never
    container_name: homeassistant
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://localhost:8123/manifest.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    network_mode: host
    environment:
      - TZ=America/New_York
    volumes:
      - /mnt/storage/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
