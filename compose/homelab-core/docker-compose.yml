networks:
  proxy:
    name: proxy
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
        - subnet: fd00:dead:cafe::/64
          gateway: fd00:dead:cafe::1

volumes:
  arcane_data:
  npm_data:
  npm_letsencrypt:

services:
  # --- Reverse proxy: routes to every future service by container name ---
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:2.17.1-patched   # Arcane/Copa OS-package patch of jc21/nginx-proxy-manager:2.17.1
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:81/api/ | grep -q '\"status\":\"OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - TZ=America/New_York
    networks:
      proxy:
        ipv4_address: 172.18.255.10
    ports:
      - "192.168.1.10:81:81"     # admin UI, LAN / Tailscale only
      - "192.168.1.10:80:80"     # http
      - "192.168.1.10:443:443"   # https
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # --- Container and Compose management UI (replaces Portainer) ---
  # Project folders are mounted at their real host paths so Compose's relative
  # bind mounts resolve correctly. Inside the container /mnt/storage holds only
  # the two project folders, so scanning it never walks the music library.
  arcane:
    container_name: arcane
    image: getarcaneapp/manager:v3.1.1
    restart: unless-stopped
    cgroup: host
    env_file: arcane.env          # ARCANE_ENCRYPTION_KEY, mode 600, not in the docs repo
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
      - ARCANE_APP_URL=https://arcane.example.duckdns.org
      - ARCANE_TRUSTED_PROXIES=172.18.255.10/32
      - ANALYTICS_ENABLED=false     # no usage heartbeat to checkin.getarcane.app
      - ARCANE_PROJECTS_DIRECTORY=/home/admin/homelab
      - 'ARCANE_PROJECTS_DIRECTORIES=[{"path":"/mnt/storage","enabled":true}]'
    extra_hosts:
      - "checkin.getarcane.app:0.0.0.0"   # belt and braces: block the usage heartbeat
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - /home/admin/homelab:/home/admin/homelab
      - /mnt/storage/vaultwarden:/mnt/storage/vaultwarden
      - /mnt/storage/obsidian-livesync:/mnt/storage/obsidian-livesync
