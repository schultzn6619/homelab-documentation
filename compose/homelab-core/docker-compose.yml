networks:
  proxy:
    name: proxy
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
        - subnet: fd00:dead:cafe::/64
          gateway: fd00:dead:cafe::1

volumes:
  portainer_data:
  npm_data:
  npm_letsencrypt:

services:
  # --- Reverse proxy: routes to every future service by container name ---
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:2.16.0
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      proxy:
        ipv4_address: 172.18.255.10
    ports:
      - "192.168.1.10:81:81"     # admin UI, LAN / Tailscale only
      - "192.168.1.10:80:80"     # http
      - "192.168.1.10:443:443"   # https
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # --- Container management UI ---
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.45.3
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - proxy
    ports:
      - "192.168.1.10:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
