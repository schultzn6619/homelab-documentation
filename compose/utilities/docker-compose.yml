# Utility web apps, reached only through Nginx Proxy Manager on the proxy network.
services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933-patched   # Arcane/Copa OS-package patch of corentinth/it-tools:2024.10.22-7ca5933
    pull_policy: never
    container_name: it-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - TZ=America/New_York
    networks:
      proxy:

  snapotter:
    image: snapotter/snapotter:2.3.0-patched   # Arcane/Copa OS-package patch of snapotter/snapotter:2.3.0
    pull_policy: never
    container_name: SnapOtter
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      proxy:
        aliases: [snapotter]
    volumes:
      - snapotter-data:/data

volumes:
  snapotter-data:
    name: SnapOtter-data
    external: true

networks:
  proxy:
    external: true
