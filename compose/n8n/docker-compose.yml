# ~/n8n/docker-compose.yml
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.example.duckdns.org
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - /mnt/storage/n8n:/home/node/.n8n
      # Rocketbook scans land in the Obsidian vault; LiveSync syncs them to devices
      - "/mnt/storage/obsidian-livesync/vault/Rocketbook Inbox:/home/node/.n8n-files/rocketbook"
    networks:
      - proxy

networks:
  proxy:
    external: true
