services:
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    restart: always
    ports:
      - "192.168.1.10:8091:8080"   # AIO interface (self-signed HTTPS)
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      APACHE_ADDITIONAL_NETWORK: "proxy"
      APACHE_PORT: "11000"
      APACHE_IP_BINDING: "@INTERNAL"   # no host port; NPM reaches nextcloud-aio-apache on proxy
      NC_DOMAIN: "cloud.example.duckdns.org"
      SKIP_DOMAIN_VALIDATION: "true"
      TZ: "America/New_York"
      NEXTCLOUD_DATADIR: "/mnt/storage/nextcloud"   # actual file storage goes here, not the boot drive
    networks:
      - proxy

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

networks:
  proxy:
    external: true
